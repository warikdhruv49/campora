<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page not found · CAMPORA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0d12;
        color: #e6ebf2;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .num {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 64px;
        font-weight: 700;
        color: #2a3644;
        letter-spacing: 0.05em;
      }
      h1 { font-size: 18px; font-weight: 600; margin-top: 16px; color: #e6ebf2; }
      p { font-size: 12px; color: #8b98a9; margin-top: 6px; max-width: 320px; margin-left: auto; margin-right: auto; line-height: 1.6; }
      a {
        display: inline-block;
        margin-top: 28px;
        padding: 10px 22px;
        border-radius: 8px;
        background: #00d492;
        color: #06120c;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        transition: opacity 0.15s ease;
      }
      a:hover { opacity: 0.85; }
    </style>
  </head>
  <body>
    <main>
      <div class="num">404</div>
      <h1>Page not found</h1>
      <p>This route doesn't exist on the terminal. It may have been moved, or the address is incorrect.</p>
      <a href="/">Back to Dashboard</a>
    </main>
  </body>
</html>
